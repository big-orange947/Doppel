[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "doppel-memory"
version = "0.5.3"
description = "An open-source, role-aware memory framework for IM agents: speaker-aware, scoped, pluggable memory with persona materials."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Doppel Contributors" }]
keywords = [
    "agent-memory", "llm-memory", "persona", "chat-agent",
    "memory-framework", "im-agent", "role-aware", "sqlite", "graphiti", "neo4j",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
dependencies = [
    "pydantic>=2.8.0",
]

[project.optional-dependencies]
graphiti = [
    "graphiti-core>=0.29.0,<0.30.0",
    "neo4j>=5.20.0",
    "fastembed>=0.8.0,<0.9.0",
]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "httpx>=0.27",
    "ruff>=0.15.0",
    "pyright>=1.1.400",
]

[project.urls]
Homepage = "https://github.com/big-orange947/Doppel"
Repository = "https://github.com/big-orange947/Doppel"

[tool.hatch.build.targets.wheel]
packages = ["doppel_memory"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
target-version = "py311"

[tool.pyright]
pythonVersion = "3.11"
typeCheckingMode = "basic"
include = ["doppel_memory", "benchmarks"]
