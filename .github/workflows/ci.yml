name: CI

on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Tests (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
      - uses: astral-sh/setup-uv@v9.0.0
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock
      - run: uv sync --locked --extra dev
      - run: uv run pytest -q

  quality:
    name: Lint and type check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@v9.0.0
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock
      - run: uv sync --locked --extra dev --extra graphiti
      - run: uv run ruff format --check doppel_memory tests examples benchmarks
      - run: uv run ruff check doppel_memory tests examples benchmarks
      - run: uv run pyright

  benchmark-smoke:
    name: Store benchmark smoke test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@v9.0.0
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock
      - run: uv sync --locked --extra dev
      - name: Run correctness-gated SQLite benchmark
        run: >-
          uv run python -m benchmarks.store_benchmark
          --backend sqlite
          --dataset benchmarks/datasets/synthetic-small.json
          --output "$RUNNER_TEMP/doppel-benchmark.json"

  store-conformance:
    name: Store conformance kit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@v9.0.0
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock
      - run: uv sync --locked --extra dev
      - name: Audit the SQLite reference backend through the installed CLI
        run: >-
          uv run doppel-conformance
          --backend sqlite
          --require-capability pagination
          --require-capability temporal_search
          --require-capability hard_delete
          --output "$RUNNER_TEMP/doppel-store-conformance.json"

  postgres-store:
    name: PostgreSQL Store integration
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: doppel_test
          POSTGRES_USER: doppel
          POSTGRES_PASSWORD: doppel
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U doppel -d doppel_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DOPPEL_TEST_POSTGRES_DSN: postgresql://doppel:doppel@127.0.0.1:5432/doppel_test
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@v9.0.0
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock
      - run: uv sync --locked --extra dev --extra postgres
      - name: Run PostgreSQL contract and concurrency tests
        run: >-
          uv run pytest -q
          tests/test_postgres_contract.py
          tests/test_postgres_runtime.py
          tests/test_postgres_unit.py
      - name: Audit PostgreSQL through the installed CLI
        run: >-
          uv run doppel-conformance
          --backend postgres
          --dsn "$DOPPEL_TEST_POSTGRES_DSN"
          --allow-mutating-audit
          --require-capability pagination
          --require-capability temporal_search
          --require-capability hard_delete
          --output "$RUNNER_TEMP/doppel-postgres-conformance.json"

  style-quality-smoke:
    name: Style quality smoke test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@v9.0.0
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock
      - run: uv sync --locked --extra dev
      - name: Run correctness-gated observable style benchmark
        run: >-
          uv run python -m benchmarks.style_quality
          --dataset benchmarks/datasets/style-quality-v1.json
          --output "$RUNNER_TEMP/doppel-style-quality.json"

  graphiti-adapter:
    name: Graphiti adapter smoke test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@v9.0.0
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock
      - run: uv sync --locked --extra dev --extra graphiti
      - run: uv run pytest -q tests/test_graphiti_adapter.py

  build:
    name: Build wheel
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@v9.0.0
      - run: uv build --no-sources
      - name: Verify wheel in an isolated environment
        shell: bash
        run: |
          wheel="$(find dist -name '*.whl' -print -quit)"
          test -n "$wheel"
          uv run --isolated --no-project --with "$wheel" python -c "from importlib.metadata import version; import doppel_memory; assert doppel_memory.__version__ == version('doppel-memory')"
